name: GitHub Classroom Autograding

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  actions: read

jobs:
  autograding:
    name: Autograding
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Installation des dépendances
        run: |
          sudo apt-get update
          sudo apt-get install -y bc

      - name: Rendre les scripts exécutables
        run: |
          find Exos -name "*.sh" -exec chmod +x {} \;
          chmod +x run_all_tests.sh

      # Ex1 - Calculatrice (5 pts)
      - name: Ex1 - Calculatrice simple
        id: ex1
        continue-on-error: true
        run: |
          cd Exos/ex1
          OUTPUT=$(./test_ex1.sh 2>&1)
          echo "$OUTPUT"
          SCORE=$(echo "$OUTPUT" | grep "Score :" | grep -oE "[0-9]+\.?[0-9]*" | head -1)
          MAX=5
          echo "score=$SCORE" >> $GITHUB_OUTPUT
          echo "max=$MAX" >> $GITHUB_OUTPUT
          # Si le score est vide, on met 0
          if [ -z "$SCORE" ]; then
            echo "score=0" >> $GITHUB_OUTPUT
            exit 1
          fi

      # Ex2 - Vérificateur mot de passe (5 pts)
      - name: Ex2 - Vérificateur mot de passe
        id: ex2
        continue-on-error: true
        run: |
          cd Exos/ex2
          OUTPUT=$(./test_ex2.sh 2>&1)
          echo "$OUTPUT"
          SCORE=$(echo "$OUTPUT" | grep "Score :" | grep -oE "[0-9]+\.?[0-9]*" | head -1)
          MAX=5
          echo "score=$SCORE" >> $GITHUB_OUTPUT
          echo "max=$MAX" >> $GITHUB_OUTPUT
          if [ -z "$SCORE" ]; then
            echo "score=0" >> $GITHUB_OUTPUT
            exit 1
          fi

      # Ex3 - Analyseur de logs (6 pts)
      - name: Ex3 - Analyseur de logs
        id: ex3
        continue-on-error: true
        run: |
          cd Exos/ex3
          OUTPUT=$(./test_ex3.sh 2>&1)
          echo "$OUTPUT"
          SCORE=$(echo "$OUTPUT" | grep "Score :" | grep -oE "[0-9]+\.?[0-9]*" | head -1)
          MAX=6
          echo "score=$SCORE" >> $GITHUB_OUTPUT
          echo "max=$MAX" >> $GITHUB_OUTPUT
          if [ -z "$SCORE" ]; then
            echo "score=0" >> $GITHUB_OUTPUT
            exit 1
          fi

      # Ex4 - Menu interactif (8 pts)
      - name: Ex4 - Menu interactif
        id: ex4
        continue-on-error: true
        run: |
          cd Exos/ex4
          OUTPUT=$(./test_ex4.sh 2>&1)
          echo "$OUTPUT"
          SCORE=$(echo "$OUTPUT" | grep "Score :" | grep -oE "[0-9]+\.?[0-9]*" | head -1)
          MAX=8
          echo "score=$SCORE" >> $GITHUB_OUTPUT
          echo "max=$MAX" >> $GITHUB_OUTPUT
          if [ -z "$SCORE" ]; then
            echo "score=0" >> $GITHUB_OUTPUT
            exit 1
          fi

      # Ex5 - BONUS (4 pts)
      - name: Ex5 - Compteur fichiers (BONUS)
        id: ex5
        continue-on-error: true
        run: |
          cd Exos/ex5
          OUTPUT=$(./test_ex5.sh 2>&1)
          echo "$OUTPUT"
          SCORE=$(echo "$OUTPUT" | grep -E "Score|Score BONUS" | grep -oE "[0-9]+\.?[0-9]*" | head -1)
          MAX=4
          echo "score=$SCORE" >> $GITHUB_OUTPUT
          echo "max=$MAX" >> $GITHUB_OUTPUT
          if [ -z "$SCORE" ]; then
            echo "score=0" >> $GITHUB_OUTPUT
          fi

      # Qualité du code (2 pts)
      - name: Qualité du code
        id: quality
        continue-on-error: true
        run: |
          quality_score=0

          # Vérifier les shebangs
          shebang_count=$(find Exos -name "*.sh" -not -path "*/test_*" -exec grep -l "^#!/bin/bash" {} \; | wc -l)
          total_scripts=$(find Exos -name "*.sh" -not -path "*/test_*" | wc -l)
          if [ "$shebang_count" -eq "$total_scripts" ] && [ "$total_scripts" -gt 0 ]; then
            echo "✓ Tous les scripts ont un shebang (0.5 pt)"
            quality_score=$(echo "$quality_score + 0.5" | bc)
          else
            echo "✗ Certains scripts n'ont pas de shebang"
          fi

          # Vérifier les commentaires
          comment_count=$(find Exos -name "*.sh" -not -path "*/test_*" -exec grep -c "^#" {} \; | awk '{s+=$1} END {print s}')
          if [ "$comment_count" -gt 15 ]; then
            echo "✓ Code bien commenté (0.5 pt)"
            quality_score=$(echo "$quality_score + 0.5" | bc)
          else
            echo "✗ Code insuffisamment commenté ($comment_count commentaires)"
          fi

          # Vérifier les permissions exécutables
          exec_count=$(find Exos -name "*.sh" -not -path "*/test_*" -executable | wc -l)
          if [ "$exec_count" -eq "$total_scripts" ] && [ "$total_scripts" -gt 0 ]; then
            echo "✓ Tous les scripts sont exécutables (0.5 pt)"
            quality_score=$(echo "$quality_score + 0.5" | bc)
          else
            echo "✗ Certains scripts ne sont pas exécutables"
          fi

          # Vérifier la gestion d'erreurs
          error_handling=$(find Exos -name "*.sh" -not -path "*/test_*" -exec grep -l "exit 1\|return 1" {} \; | wc -l)
          if [ "$error_handling" -ge 2 ]; then
            echo "✓ Gestion d'erreurs présente (0.5 pt)"
            quality_score=$(echo "$quality_score + 0.5" | bc)
          else
            echo "✗ Gestion d'erreurs insuffisante"
          fi

          echo ""
          echo "Score qualité : $quality_score / 2"
          echo "score=$quality_score" >> $GITHUB_OUTPUT
          echo "max=2" >> $GITHUB_OUTPUT

      # Calcul et rapport final
      - name: Calcul du score final et création du Check Run
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            // Récupérer les scores
            const scores = {
              ex1: parseFloat('${{ steps.ex1.outputs.score }}') || 0,
              ex2: parseFloat('${{ steps.ex2.outputs.score }}') || 0,
              ex3: parseFloat('${{ steps.ex3.outputs.score }}') || 0,
              ex4: parseFloat('${{ steps.ex4.outputs.score }}') || 0,
              ex5: parseFloat('${{ steps.ex5.outputs.score }}') || 0,
              quality: parseFloat('${{ steps.quality.outputs.score }}') || 0
            };

            const maxScores = {
              ex1: 5,
              ex2: 5,
              ex3: 6,
              ex4: 8,
              ex5: 4,
              quality: 2
            };

            // Calcul des totaux
            const totalObligatoire = scores.ex1 + scores.ex2 + scores.ex3 + scores.ex4 + scores.quality;
            const totalAvecBonus = totalObligatoire + scores.ex5;
            const maxObligatoire = 26;
            const maxTotal = 30;

            // Note finale sur 20
            const noteFinale = (totalObligatoire / maxObligatoire * 20).toFixed(2);
            const noteAvecBonus = (totalAvecBonus / maxObligatoire * 20).toFixed(2);

            // Créer le rapport markdown
            const summary = `# 📊 Résultats de l'évaluation

            ## Scores par exercice

            | Exercice | Score | Maximum | Pourcentage |
            |----------|-------|---------|-------------|
            | Ex1 - Calculatrice | ${scores.ex1} | ${maxScores.ex1} | ${(scores.ex1/maxScores.ex1*100).toFixed(0)}% |
            | Ex2 - Mot de passe | ${scores.ex2} | ${maxScores.ex2} | ${(scores.ex2/maxScores.ex2*100).toFixed(0)}% |
            | Ex3 - Analyseur logs | ${scores.ex3} | ${maxScores.ex3} | ${(scores.ex3/maxScores.ex3*100).toFixed(0)}% |
            | Ex4 - Menu interactif | ${scores.ex4} | ${maxScores.ex4} | ${(scores.ex4/maxScores.ex4*100).toFixed(0)}% |
            | Qualité du code | ${scores.quality} | ${maxScores.quality} | ${(scores.quality/maxScores.quality*100).toFixed(0)}% |
            | **Ex5 - BONUS** | ${scores.ex5} | ${maxScores.ex5} | ${(scores.ex5/maxScores.ex5*100).toFixed(0)}% |

            ## 🎯 Note finale

            - **Score total (obligatoire)** : ${totalObligatoire.toFixed(1)} / ${maxObligatoire}
            - **Score avec bonus** : ${totalAvecBonus.toFixed(1)} / ${maxTotal}
            - **Note finale** : **${noteFinale} / 20**
            - **Note avec bonus** : **${noteAvecBonus} / 20**

            ---

            Points totaux pour GitHub Classroom : **${totalAvecBonus.toFixed(1)}/${maxTotal}**
            `;

            // Ajouter au summary
            await core.summary.addRaw(summary).write();

            // Créer un Check Run pour GitHub Classroom
            const checkRun = await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'Autograding',
              head_sha: context.sha,
              status: 'completed',
              conclusion: totalObligatoire >= maxObligatoire * 0.5 ? 'success' : 'failure',
              output: {
                title: `Score: ${totalAvecBonus.toFixed(1)}/${maxTotal} (Note: ${noteFinale}/20)`,
                summary: summary,
                text: `Total points: ${totalAvecBonus.toFixed(1)}/${maxTotal}\n\nPoints breakdown:\n- Ex1: ${scores.ex1}/${maxScores.ex1}\n- Ex2: ${scores.ex2}/${maxScores.ex2}\n- Ex3: ${scores.ex3}/${maxScores.ex3}\n- Ex4: ${scores.ex4}/${maxScores.ex4}\n- Ex5 (BONUS): ${scores.ex5}/${maxScores.ex5}\n- Quality: ${scores.quality}/${maxScores.quality}`
              }
            });

            // Définir les outputs pour GitHub Classroom
            core.setOutput('Points', `${totalAvecBonus.toFixed(1)}/${maxTotal}`);

            console.log('✅ Check run created:', checkRun.data.html_url);
            console.log(`📊 Final score: ${totalAvecBonus.toFixed(1)}/${maxTotal}`);
            console.log(`📝 Grade: ${noteFinale}/20`);
