name: GitHub Classroom Workflow

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  actions: read

jobs:
  grading:
    name: Autograding
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Installation des dépendances
        run: |
          sudo apt-get update
          sudo apt-get install -y bc

      - name: Rendre les scripts exécutables
        run: |
          find Exos -name "*.sh" -exec chmod +x {} \;
          chmod +x run_all_tests.sh

      # Ex1 - Calculatrice (5 pts)
      - name: Ex1 - Calculatrice simple
        id: ex1
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: "Ex1 - Calculatrice"
          setup-command: "cd Exos/ex1 && chmod +x calculatrice.sh test_ex1.sh"
          command: "cd Exos/ex1 && ./test_ex1.sh"
          timeout: 10
          max-score: 5

      # Ex2 - Vérificateur mot de passe (5 pts)
      - name: Ex2 - Vérificateur mot de passe
        id: ex2
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: "Ex2 - Vérificateur mot de passe"
          setup-command: "cd Exos/ex2 && chmod +x verif_password.sh test_ex2.sh"
          command: "cd Exos/ex2 && ./test_ex2.sh"
          timeout: 10
          max-score: 5

      # Ex3 - Analyseur de logs (6 pts)
      - name: Ex3 - Analyseur de logs
        id: ex3
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: "Ex3 - Analyseur de logs"
          setup-command: "cd Exos/ex3 && chmod +x analyser_logs.sh test_ex3.sh"
          command: "cd Exos/ex3 && ./test_ex3.sh"
          timeout: 10
          max-score: 6

      # Ex4 - Menu interactif (8 pts)
      - name: Ex4 - Menu interactif
        id: ex4
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: "Ex4 - Menu interactif"
          setup-command: "cd Exos/ex4 && chmod +x menu_calculs.sh test_ex4.sh"
          command: "cd Exos/ex4 && ./test_ex4.sh"
          timeout: 10
          max-score: 8

      # Ex5 - BONUS (4 pts)
      - name: Ex5 - Compteur fichiers (BONUS)
        id: ex5
        uses: classroom-resources/autograding-command-grader@v1
        continue-on-error: true
        with:
          test-name: "Ex5 - Compteur fichiers (BONUS)"
          setup-command: "cd Exos/ex5 && chmod +x compteur_fichiers.sh test_ex5.sh"
          command: "cd Exos/ex5 && ./test_ex5.sh"
          timeout: 10
          max-score: 4

      # Qualité du code (2 pts)
      - name: Qualité du code
        id: quality
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: "Qualité du code"
          command: |
            quality_score=0
            # Vérifier les shebangs
            shebang_count=$(find Exos -name "*.sh" -not -path "*/test_*" -exec grep -l "^#!/bin/bash" {} \; | wc -l)
            total_scripts=$(find Exos -name "*.sh" -not -path "*/test_*" | wc -l)
            [ "$shebang_count" -eq "$total_scripts" ] && [ "$total_scripts" -gt 0 ] && quality_score=$(echo "$quality_score + 0.5" | bc)
            # Vérifier les commentaires
            comment_count=$(find Exos -name "*.sh" -not -path "*/test_*" -exec grep -c "^#" {} \; | awk '{s+=$1} END {print s}')
            [ "$comment_count" -gt 15 ] && quality_score=$(echo "$quality_score + 0.5" | bc)
            # Vérifier les permissions
            exec_count=$(find Exos -name "*.sh" -not -path "*/test_*" -executable | wc -l)
            [ "$exec_count" -eq "$total_scripts" ] && [ "$total_scripts" -gt 0 ] && quality_score=$(echo "$quality_score + 0.5" | bc)
            # Vérifier la gestion d'erreurs
            error_handling=$(find Exos -name "*.sh" -not -path "*/test_*" -exec grep -l "exit 1\|return 1" {} \; | wc -l)
            [ "$error_handling" -ge 2 ] && quality_score=$(echo "$quality_score + 0.5" | bc)
            echo "Score qualité : $quality_score / 2"
            exit 0
          timeout: 10
          max-score: 2

      # Autograding Reporter
      - name: Autograding Reporter
        uses: classroom-resources/autograding-grading-reporter@v1
        env:
          EX1_RESULTS: "${{steps.ex1.outputs.result}}"
          EX2_RESULTS: "${{steps.ex2.outputs.result}}"
          EX3_RESULTS: "${{steps.ex3.outputs.result}}"
          EX4_RESULTS: "${{steps.ex4.outputs.result}}"
          EX5_RESULTS: "${{steps.ex5.outputs.result}}"
          QUALITY_RESULTS: "${{steps.quality.outputs.result}}"
        with:
          runners: ex1,ex2,ex3,ex4,ex5,quality
