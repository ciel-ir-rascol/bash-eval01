name: Autograding Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  test:
    name: Tests automatisés - EVAL01
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configuration de l'environnement
        run: |
          sudo apt-get update
          sudo apt-get install -y bc
          echo "✅ Dépendances installées"

      - name: Rendre les scripts exécutables
        run: |
          find Exos -name "*.sh" -exec chmod +x {} \;
          chmod +x run_all_tests.sh
          echo "✅ Scripts rendus exécutables"

      - name: "Test Ex1 - Calculatrice simple (5 pts)"
        id: test-ex1
        continue-on-error: true
        run: |
          cd Exos/ex1
          ./test_ex1.sh > test_output.txt 2>&1
          cat test_output.txt
          score=$(grep "Score :" test_output.txt | grep -oE "[0-9]+\.?[0-9]*" | head -1)
          echo "score=$score" >> $GITHUB_OUTPUT
          echo "max=5" >> $GITHUB_OUTPUT
          if [ -z "$score" ]; then
            echo "⚠️ Impossible d'extraire le score"
            exit 1
          fi

      - name: "Test Ex2 - Vérificateur mot de passe (5 pts)"
        id: test-ex2
        continue-on-error: true
        run: |
          cd Exos/ex2
          ./test_ex2.sh > test_output.txt 2>&1
          cat test_output.txt
          score=$(grep "Score :" test_output.txt | grep -oE "[0-9]+\.?[0-9]*" | head -1)
          echo "score=$score" >> $GITHUB_OUTPUT
          echo "max=5" >> $GITHUB_OUTPUT
          if [ -z "$score" ]; then
            echo "⚠️ Impossible d'extraire le score"
            exit 1
          fi

      - name: "Test Ex3 - Analyseur de logs (6 pts)"
        id: test-ex3
        continue-on-error: true
        run: |
          cd Exos/ex3
          ./test_ex3.sh > test_output.txt 2>&1
          cat test_output.txt
          score=$(grep "Score :" test_output.txt | grep -oE "[0-9]+\.?[0-9]*" | head -1)
          echo "score=$score" >> $GITHUB_OUTPUT
          echo "max=6" >> $GITHUB_OUTPUT
          if [ -z "$score" ]; then
            echo "⚠️ Impossible d'extraire le score"
            exit 1
          fi

      - name: "Test Ex4 - Menu interactif (8 pts)"
        id: test-ex4
        continue-on-error: true
        run: |
          cd Exos/ex4
          ./test_ex4.sh > test_output.txt 2>&1
          cat test_output.txt
          score=$(grep "Score :" test_output.txt | grep -oE "[0-9]+\.?[0-9]*" | head -1)
          echo "score=$score" >> $GITHUB_OUTPUT
          echo "max=8" >> $GITHUB_OUTPUT
          if [ -z "$score" ]; then
            echo "⚠️ Impossible d'extraire le score"
            exit 1
          fi

      - name: "Test Ex5 BONUS - Compteur de fichiers (4 pts)"
        id: test-ex5
        continue-on-error: true
        run: |
          cd Exos/ex5
          ./test_ex5.sh > test_output.txt 2>&1
          cat test_output.txt
          score=$(grep "Score" test_output.txt | grep -oE "[0-9]+\.?[0-9]*" | head -1)
          echo "score=$score" >> $GITHUB_OUTPUT
          echo "max=4" >> $GITHUB_OUTPUT
          if [ -z "$score" ]; then
            echo "⚠️ Impossible d'extraire le score (bonus non implémenté)"
            echo "score=0" >> $GITHUB_OUTPUT
          fi

      - name: "Vérification qualité du code (2 pts)"
        id: test-quality
        continue-on-error: true
        run: |
          echo "=== Vérification de la qualité du code ==="
          quality_score=0

          # Vérifier les shebangs
          shebang_count=$(find Exos -name "*.sh" -not -path "*/test_*" -exec grep -l "^#!/bin/bash" {} \; | wc -l)
          total_scripts=$(find Exos -name "*.sh" -not -path "*/test_*" | wc -l)

          if [ "$shebang_count" -eq "$total_scripts" ] && [ "$total_scripts" -gt 0 ]; then
            echo "✓ Tous les scripts ont un shebang (0.5 pt)"
            quality_score=$(echo "$quality_score + 0.5" | bc)
          else
            echo "✗ Certains scripts n'ont pas de shebang"
          fi

          # Vérifier les commentaires
          comment_count=$(find Exos -name "*.sh" -not -path "*/test_*" -exec grep -c "^#" {} \; | awk '{s+=$1} END {print s}')
          if [ "$comment_count" -gt 15 ]; then
            echo "✓ Code bien commenté (0.5 pt)"
            quality_score=$(echo "$quality_score + 0.5" | bc)
          else
            echo "✗ Code insuffisamment commenté ($comment_count commentaires)"
          fi

          # Vérifier les permissions exécutables
          exec_count=$(find Exos -name "*.sh" -not -path "*/test_*" -executable | wc -l)
          if [ "$exec_count" -eq "$total_scripts" ] && [ "$total_scripts" -gt 0 ]; then
            echo "✓ Tous les scripts sont exécutables (0.5 pt)"
            quality_score=$(echo "$quality_score + 0.5" | bc)
          else
            echo "✗ Certains scripts ne sont pas exécutables"
          fi

          # Vérifier la gestion d'erreurs basique
          error_handling=$(find Exos -name "*.sh" -not -path "*/test_*" -exec grep -l "exit 1\|return 1" {} \; | wc -l)
          if [ "$error_handling" -ge 2 ]; then
            echo "✓ Gestion d'erreurs présente (0.5 pt)"
            quality_score=$(echo "$quality_score + 0.5" | bc)
          else
            echo "✗ Gestion d'erreurs insuffisante"
          fi

          echo ""
          echo "Score qualité : $quality_score / 2"
          echo "score=$quality_score" >> $GITHUB_OUTPUT
          echo "max=2" >> $GITHUB_OUTPUT

      - name: Calcul du score final
        id: final-score
        run: |
          # Récupérer tous les scores (gérer les valeurs vides)
          ex1_score="${{ steps.test-ex1.outputs.score }}"
          ex2_score="${{ steps.test-ex2.outputs.score }}"
          ex3_score="${{ steps.test-ex3.outputs.score }}"
          ex4_score="${{ steps.test-ex4.outputs.score }}"
          ex5_score="${{ steps.test-ex5.outputs.score }}"
          quality_score="${{ steps.test-quality.outputs.score }}"

          # Remplacer les valeurs vides par 0
          ex1_score=${ex1_score:-0}
          ex2_score=${ex2_score:-0}
          ex3_score=${ex3_score:-0}
          ex4_score=${ex4_score:-0}
          ex5_score=${ex5_score:-0}
          quality_score=${quality_score:-0}

          # Calcul du total
          total_obligatoire=$(echo "$ex1_score + $ex2_score + $ex3_score + $ex4_score + $quality_score" | bc)
          total_avec_bonus=$(echo "$total_obligatoire + $ex5_score" | bc)

          # Note finale sur 20
          note_finale=$(echo "scale=2; ($total_obligatoire / 26) * 20" | bc)
          note_avec_bonus=$(echo "scale=2; ($total_avec_bonus / 26) * 20" | bc)

          echo "=========================================="
          echo "📊 RÉSULTATS FINAUX"
          echo "=========================================="
          echo ""
          echo "Exercices obligatoires :"
          echo "  Ex1 (Calculatrice)     : $ex1_score / 5"
          echo "  Ex2 (Mot de passe)     : $ex2_score / 5"
          echo "  Ex3 (Analyseur logs)   : $ex3_score / 6"
          echo "  Ex4 (Menu interactif)  : $ex4_score / 8"
          echo "  Qualité du code        : $quality_score / 2"
          echo ""
          echo "Exercice bonus :"
          echo "  Ex5 (Compteur fichiers): $ex5_score / 4"
          echo ""
          echo "=========================================="
          echo "Total (obligatoire)     : $total_obligatoire / 26"
          echo "Total (avec bonus)      : $total_avec_bonus / 30"
          echo "Note finale             : $note_finale / 20"
          echo "Note avec bonus         : $note_avec_bonus / 20"
          echo "=========================================="

          # Sauvegarder pour les autres jobs
          echo "total_obligatoire=$total_obligatoire" >> $GITHUB_OUTPUT
          echo "total_avec_bonus=$total_avec_bonus" >> $GITHUB_OUTPUT
          echo "note_finale=$note_finale" >> $GITHUB_OUTPUT
          echo "note_avec_bonus=$note_avec_bonus" >> $GITHUB_OUTPUT

          # Créer un badge de résultat
          if (( $(echo "$note_finale >= 16" | bc -l) )); then
            echo "badge_color=brightgreen" >> $GITHUB_OUTPUT
            echo "badge_label=Excellent" >> $GITHUB_OUTPUT
          elif (( $(echo "$note_finale >= 12" | bc -l) )); then
            echo "badge_color=green" >> $GITHUB_OUTPUT
            echo "badge_label=Bien" >> $GITHUB_OUTPUT
          elif (( $(echo "$note_finale >= 10" | bc -l) )); then
            echo "badge_color=yellow" >> $GITHUB_OUTPUT
            echo "badge_label=Moyen" >> $GITHUB_OUTPUT
          else
            echo "badge_color=orange" >> $GITHUB_OUTPUT
            echo "badge_label=En cours" >> $GITHUB_OUTPUT
          fi

      - name: Créer un rapport détaillé
        if: always()
        run: |
          mkdir -p .github/results
          cat > .github/results/report.md << 'EOF'
          # 📝 Rapport d'évaluation - EVAL01 Scripts Bash

          ## 📊 Scores par exercice

          | Exercice | Score obtenu | Score max | Pourcentage |
          |----------|--------------|-----------|-------------|
          | Ex1 - Calculatrice | ${{ steps.test-ex1.outputs.score || '0' }} | 5 | $(echo "scale=0; (${{ steps.test-ex1.outputs.score || '0' }} / 5) * 100" | bc)% |
          | Ex2 - Mot de passe | ${{ steps.test-ex2.outputs.score || '0' }} | 5 | $(echo "scale=0; (${{ steps.test-ex2.outputs.score || '0' }} / 5) * 100" | bc)% |
          | Ex3 - Analyseur logs | ${{ steps.test-ex3.outputs.score || '0' }} | 6 | $(echo "scale=0; (${{ steps.test-ex3.outputs.score || '0' }} / 6) * 100" | bc)% |
          | Ex4 - Menu interactif | ${{ steps.test-ex4.outputs.score || '0' }} | 8 | $(echo "scale=0; (${{ steps.test-ex4.outputs.score || '0' }} / 8) * 100" | bc)% |
          | Qualité du code | ${{ steps.test-quality.outputs.score || '0' }} | 2 | $(echo "scale=0; (${{ steps.test-quality.outputs.score || '0' }} / 2) * 100" | bc)% |
          | **Ex5 - BONUS** | ${{ steps.test-ex5.outputs.score || '0' }} | 4 | $(echo "scale=0; (${{ steps.test-ex5.outputs.score || '0' }} / 4) * 100" | bc)% |

          ## 🎯 Note finale

          - **Score total (obligatoire)** : ${{ steps.final-score.outputs.total_obligatoire }} / 26
          - **Score avec bonus** : ${{ steps.final-score.outputs.total_avec_bonus }} / 30
          - **Note finale** : **${{ steps.final-score.outputs.note_finale }} / 20**
          - **Note avec bonus** : **${{ steps.final-score.outputs.note_avec_bonus }} / 20**

          ## 💡 Conseils

          - Consultez les logs détaillés de chaque test pour identifier les problèmes
          - Testez vos scripts localement avec `./run_all_tests.sh`
          - Vérifiez que tous vos scripts sont exécutables (`chmod +x`)
          - Ajoutez des commentaires pour expliquer votre code

          ---

          *Rapport généré automatiquement par GitHub Actions*
          EOF

      - name: Créer un commentaire de feedback (PR)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('.github/results/report.md', 'utf8');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });

      - name: Résumé dans le job summary
        if: always()
        run: |
          cat .github/results/report.md >> $GITHUB_STEP_SUMMARY
