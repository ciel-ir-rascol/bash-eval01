name: Autograding Tests
'on':
- push
- repository_dispatch
permissions:
  checks: write
  actions: read
  contents: read
jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Ex1 - Calculatrice simple
      id: ex1---calculatrice-simple
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: Ex1 - Calculatrice simple
        setup-command: sudo apt-get update && sudo apt-get install -y bc
        command: cd Exos/ex1 && chmod +x test_ex1.sh && ./test_ex1.sh
        timeout: 2
        max-score: 5
    - name: Ex2 - Vérificateur mot de passe
      id: ex2---verificateur-mot-de-passe
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: Ex2 - Vérificateur mot de passe
        setup-command: sudo apt-get update && sudo apt-get install -y bc
        command: cd Exos/ex2 && chmod +x test_ex2.sh && ./test_ex2.sh
        timeout: 2
        max-score: 5
    - name: Ex3 - Analyseur de logs
      id: ex3---analyseur-de-logs
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: Ex3 - Analyseur de logs
        setup-command: sudo apt-get update && sudo apt-get install -y bc
        command: cd Exos/ex3 && chmod +x test_ex3.sh && ./test_ex3.sh
        timeout: 2
        max-score: 6
    - name: Ex4 - Menu interactif
      id: ex4---menu-interactif
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: Ex4 - Menu interactif
        setup-command: sudo apt-get update && sudo apt-get install -y bc
        command: cd Exos/ex4 && chmod +x test_ex4.sh && ./test_ex4.sh
        timeout: 2
        max-score: 8
    - name: Ex5 - Compteur fichiers (BONUS)
      id: ex5---compteur-fichiers-bonus
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: Ex5 - Compteur fichiers (BONUS)
        setup-command: sudo apt-get update && sudo apt-get install -y bc
        command: cd Exos/ex5 && chmod +x test_ex5.sh && ./test_ex5.sh
        timeout: 2
        max-score: 4
    - name: Autograding Reporter
      uses: classroom-resources/autograding-grading-reporter@v1
      env:
        EX1---CALCULATRICE-SIMPLE_RESULTS: "${{steps.ex1---calculatrice-simple.outputs.result}}"
        EX2---VERIFICATEUR-MOT-DE-PASSE_RESULTS: "${{steps.ex2---verificateur-mot-de-passe.outputs.result}}"
        EX3---ANALYSEUR-DE-LOGS_RESULTS: "${{steps.ex3---analyseur-de-logs.outputs.result}}"
        EX4---MENU-INTERACTIF_RESULTS: "${{steps.ex4---menu-interactif.outputs.result}}"
        EX5---COMPTEUR-FICHIERS-BONUS_RESULTS: "${{steps.ex5---compteur-fichiers-bonus.outputs.result}}"
      with:
        runners: ex1---calculatrice-simple,ex2---verificateur-mot-de-passe,ex3---analyseur-de-logs,ex4---menu-interactif,ex5---compteur-fichiers-bonus
